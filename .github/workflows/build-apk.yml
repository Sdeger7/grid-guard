name: Build Android APK

# Two jobs: a fast Dart check (analyze + tests) that catches code errors in ~2
# minutes, and the APK build. This repo has no committed android/ folder and the
# dev container has no Android SDK, so the platform scaffolding is regenerated
# here before building.
on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test

  apk:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to publish the rolling release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.sdeger --project-name grid_guard .

      - name: Install dependencies
        run: flutter pub get

      # Gradle's first run downloads its distribution, which intermittently
      # drops on hosted runners — retry before giving up.
      - name: Build release APK
        run: |
          for attempt in 1 2 3; do
            echo "::group::APK build attempt $attempt"
            if flutter build apk --release --split-per-abi; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "Attempt $attempt failed; retrying in 20s..."
            sleep 20
          done
          echo "APK build failed after 3 attempts"
          exit 1

      # Per-ABI APKs are ~a third the size of the fat one, which matters a lot
      # when the install path is "download it on a phone over mobile data".
      # arm64-v8a covers essentially every phone made since ~2016.
      - name: Collect APK
        run: |
          mkdir -p dist
          # Fixed names so the release download URL never changes and each
          # build replaces the last one instead of piling up.
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             dist/grid-guard-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
             dist/grid-guard-arm32.apk
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: grid-guard-apk
          path: dist/*.apk
          retention-days: 30

      # A rolling "latest" release gives a plain, one-tap download link that
      # works on a phone without unzipping or signing in.
      - name: Publish to the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Grid Guard — latest build
          body: |
            Newest Android build, updated automatically on every push.

            **Install:** tap `grid-guard-arm64.apk` below (that's the right one
            for any phone from roughly 2016 onward), then allow installs from
            this source when Android asks. `arm32` is the fallback for older
            devices.

            Commit: ${{ github.sha }}
          files: dist/*.apk
          prerelease: true
          make_latest: true
